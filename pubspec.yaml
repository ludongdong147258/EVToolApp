name: ev_tool_app
description: EV Tool - Electric Vehicle Companion App
publish_to: 'none'
# The `+N` build segment makes CFBundleVersion resolve to an incrementing
# integer (1) instead of "1.0.0", which App Store Connect requires.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0

  # JSON / Data Classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.0.0

  # Logging
  logger: ^2.5.0

  # UI
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0

  # Env
  flutter_dotenv: ^5.2.1

  # Files & Sharing
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7

  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Maps (Apple MapKit)
  apple_maps_flutter: ^1.2.0

  # External links
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation (run after editing freezed/json annotations):
  # dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/common/
